workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    scripts:
      - name: Recreate Android files without v1 embedding
        script: |
          rm -rf android
          flutter create . --platforms=android --project-name=global_udhar_khatta
      - name: Clean and Get Flutter packages
        script: |
          flutter clean
          flutter pub get
      - name: Build Android APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
